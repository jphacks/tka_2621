<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- YouTubeの埋め込みは、参照元(Referer)が送られないとエラーになることがある -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>サッカー観戦ガイド（仮）</title>
<style>
  :root {
    --turf: #14342b;
    --turf-deep: #0d211b;
    --turf-soft: #1f4a3c;
    --chalk: #edf2ee;
    --paper: #ffffff;
    --ink: #12231d;
    --muted: #55655e;
    --line: #cdd8d0;
    --yellow: #f2c230;
    --yellow-ink: #3a2e00;
    --font: "BIZ UDPGothic", "Yu Gothic UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { font-size: 16px; }
  body { margin: 0; background: var(--chalk); color: var(--ink); font-family: var(--font); line-height: 1.6; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

  .page { max-width: 1480px; margin: 0 auto; padding: 16px 24px 40px; }
  .top { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .top h1 { margin: 0; font-size: 1.05rem; font-weight: 700; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); padding: 3px; }
  .seg button { border: 0; background: transparent; padding: 4px 14px; border-radius: 999px; font-weight: 700; font-size: 0.92rem; color: var(--muted); }
  .seg button[aria-pressed=true] { background: var(--turf); color: var(--chalk); }
  .toggle { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 14px; font-weight: 700; font-size: 0.92rem; color: var(--muted); }
  .toggle[aria-pressed=true] { background: var(--turf); border-color: var(--turf); color: var(--chalk); }
  .toggle[hidden] { display: none; }
  .top select { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); max-width: 100%; }

  /* 動画が主役。解説は動画の外側に置き、動画の上には何も重ねない(YouTubeの規約) */
  .layout { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(300px, 1fr); gap: 24px; align-items: start; }
  @media (max-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr); } }

  .theater { padding: 14px; border-radius: 18px; background: var(--turf-deep); transition: box-shadow 450ms ease; }
  /* すごい場面: 動画の外側を光らせる。周辺視野で気づけて、読まなくても分かる */
  .theater.glow1 { box-shadow: 0 0 0 2px rgba(242,194,48,0.55), 0 0 26px 2px rgba(242,194,48,0.3); }
  .theater.glow2 { box-shadow: 0 0 0 3px var(--yellow), 0 0 58px 8px rgba(242,194,48,0.55); }
  .stage { aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; }
  .stage > * { width: 100%; height: 100%; border: 0; }
  .stage .placeholder { display: grid; place-content: center; gap: 6px; padding: 24px; text-align: center; background: var(--turf-soft); color: var(--chalk); }
  .stage .placeholder strong { font-size: 1.15rem; }
  .stage .placeholder span { color: #c5d6cc; font-size: 0.95rem; }

  /* 動画の真下の1行。ここだけ見れば流れが分かる */
  .strip { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 0 4px; min-height: 2.6rem; color: var(--chalk); }
  .strip .when { flex: none; font-size: 0.85rem; color: #a9bfb3; font-variant-numeric: tabular-nums; min-width: 2.8em; }
  .strip .kind { flex: none; }
  .strip .gist { flex: 1; min-width: 0; margin: 0; font-size: 1.2rem; font-weight: 700; line-height: 1.4; }
  .strip .gist.idle { font-weight: 400; color: #a9bfb3; font-size: 1rem; }
  .strip .soon { flex: none; padding: 1px 10px; border-radius: 6px; border: 2px solid var(--yellow); color: var(--yellow); font-weight: 700; font-size: 0.88rem; white-space: nowrap; }
  .strip .wow { flex: none; padding: 1px 10px; border-radius: 6px; background: var(--yellow); color: var(--yellow-ink); font-weight: 700; font-size: 0.88rem; white-space: nowrap; }
  .strip .fs { flex: none; border: 1px solid #3d5c50; background: transparent; color: #c5d6cc; border-radius: 8px; padding: 3px 12px; font-size: 0.85rem; }
  .strip .fs[hidden] { display: none; }
  .kind { display: inline-block; padding: 1px 10px; border-radius: 6px; background: #2c5a49; color: #e3efe8; font-weight: 700; font-size: 0.88rem; white-space: nowrap; }
  .theater:fullscreen { display: flex; flex-direction: column; justify-content: center; border-radius: 0; padding: 2vh 2vw; background: #0b1511; }
  .theater:fullscreen .stage { aspect-ratio: auto; flex: 1; min-height: 0; }
  @media (max-width: 560px) { .strip { flex-wrap: wrap; gap: 6px 10px; } .strip .gist { flex-basis: 100%; order: 5; } }
  @media (prefers-reduced-motion: reduce) { .theater { transition: none; } }

  .notice { margin: 10px 0 0; padding: 10px 14px; border-radius: 8px; background: #fff3d1; color: var(--yellow-ink); font-size: 0.95rem; }
  .notice a { color: inherit; font-weight: 700; }
  .scrub { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 10px 14px; background: var(--paper); border-radius: 10px; border: 1px solid var(--line); }
  .scrub[hidden] { display: none; }
  .scrub button { padding: 6px 16px; border: 0; border-radius: 8px; background: var(--turf); color: var(--chalk); font-weight: 700; min-width: 4.5em; }
  .scrub input[type=range] { flex: 1; accent-color: var(--turf); }
  .scrub output { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; text-align: right; }
  .fine { margin: 14px 0 0; color: var(--muted); font-size: 0.85rem; }

  /* 右: 控えめな詳細カード。読みたいときに読む */
  .side > section + section { margin-top: 20px; }
  .detail { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px 20px; min-height: 180px; }
  .detail.swap { animation: swap 240ms ease-out; }
  @keyframes swap { from { opacity: 0.4; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .detail.swap { animation: none; } }
  .detail h2 { margin: 0 0 10px; font-size: 1.05rem; }
  .detail .head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 8px; }
  .detail .head .clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.9rem; }
  .detail .kind { background: #e6eee9; color: var(--turf); }
  .detail .wow { padding: 1px 10px; border-radius: 6px; background: var(--yellow); color: var(--yellow-ink); font-weight: 700; font-size: 0.85rem; }
  .detail .soon { padding: 1px 10px; border-radius: 6px; border: 2px solid #c99a00; color: #8a6a00; font-weight: 700; font-size: 0.85rem; }
  .detail .doubt { padding: 0 8px; border: 1px solid #b4781a; border-radius: 6px; font-size: 0.8rem; color: #8a5a00; }
  .detail .explain { margin: 0; font-size: 1.1rem; font-weight: 600; line-height: 1.6; }
  .detail .context { margin: 10px 0 0; padding: 8px 12px; border-radius: 8px; background: #eef3ef; font-size: 0.95rem; }
  .detail .context b { color: var(--turf); margin-right: 6px; }
  .detail .block { margin: 14px 0 0; padding-left: 12px; border-left: 4px solid var(--yellow); }
  .detail .block .lab { margin: 0 0 2px; font-size: 0.85rem; font-weight: 700; color: #8a6a00; }
  .detail .block p { margin: 0; font-size: 1rem; line-height: 1.65; }
  .detail .block .differs { margin-top: 4px; font-size: 0.88rem; color: var(--muted); }
  .detail .scene { margin: 12px 0 0; font-size: 0.85rem; color: var(--muted); }
  .detail ul.pts { margin: 0 0 10px; padding-left: 1.2em; }
  .detail ul.pts li { margin: 3px 0; }
  .detail .sub { margin: 12px 0 4px; font-size: 0.88rem; color: var(--muted); font-weight: 700; }

  .terms { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; padding: 0; list-style: none; }
  .term { padding: 1px 10px; border-radius: 999px; border: 1.5px solid #c99a00; background: transparent; color: var(--yellow-ink); font-weight: 700; font-size: 0.88rem; }
  .term[aria-expanded=true] { background: var(--yellow); }
  .meaning { margin: 8px 0 0; padding: 8px 12px; border-radius: 8px; background: #f4f1e3; font-size: 0.92rem; }
  .meaning[hidden] { display: none; }

  .finder h2, .log h2 { margin: 0 0 8px; font-size: 0.95rem; }
  .finder input[type=search] { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); font-size: 0.95rem; }
  .hits { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
  .hit { width: 100%; display: grid; grid-template-columns: 3.6em 1fr; gap: 8px; align-items: baseline; text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); font-size: 0.92rem; }
  .hit:hover { border-color: var(--turf); }
  .hit .t { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--turf); }
  .hit .s small { display: block; color: var(--muted); }
  .finder .empty { margin: 8px 0 0; color: var(--muted); font-size: 0.9rem; }

  .log-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
  .log-head label { font-size: 0.85rem; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  .items { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .item { display: grid; grid-template-columns: 3.6em 1fr; gap: 8px; padding: 9px 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; font-size: 0.92rem; }
  .item.future { opacity: 0.55; }
  .item .t { align-self: start; padding: 0; border: 0; background: transparent; text-align: left; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--turf); text-decoration: underline; text-underline-offset: 3px; }
  .item .e { margin: 0; }
  .item .w { margin: 2px 0 0; color: var(--muted); font-size: 0.85rem; }
  .item .wow { margin-left: 6px; padding: 0 6px; border-radius: 5px; background: var(--yellow); color: var(--yellow-ink); font-weight: 700; font-size: 0.75rem; }
  .none { color: var(--muted); }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1>サッカー観戦ガイド（仮）</h1>
    <div class="controls">
      <div class="seg" role="group" aria-label="たとえのジャンル" id="genres"></div>
      <button type="button" class="toggle" id="audio" aria-pressed="false" hidden>音声ガイド</button>
      <select id="picker" aria-label="動画を選ぶ"></select>
    </div>
  </header>

  <main class="layout">
    <section aria-label="動画">
      <div class="theater" id="theater">
        <div class="stage" id="stage"></div>
        <div class="strip" id="strip" aria-live="polite"></div>
      </div>
      <p class="notice" id="notice" hidden></p>
      <div class="scrub" id="scrub" hidden>
        <button type="button" id="play">再生</button>
        <input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="再生位置">
        <output id="clock" for="seek">00:00 / 00:00</output>
      </div>
      <p class="fine">解説はAIが作ったもので、誤りを含むことがあります。</p>
    </section>

    <aside class="side" aria-label="くわしい解説">
      <section>
        <div class="detail" id="detail"></div>
      </section>
      <section class="finder">
        <h2>あの場面を探す</h2>
        <input type="search" id="q" placeholder="覚えていることを書く（例: キーパーが止めた）" autocomplete="off">
        <p class="empty" id="qmsg" hidden></p>
        <ul class="hits" id="hits"></ul>
      </section>
      <section class="log">
        <div class="log-head">
          <h2>ここまでの場面</h2>
          <label><input type="checkbox" id="showAll"> これからの場面も表示（確認用）</label>
        </div>
        <ul class="items" id="items"></ul>
      </section>
    </aside>
  </main>
</div>

<script>
"use strict";

const KIND = {
  goal: "得点", shot: "シュート", save: "セーブ", foul: "ファウル", offside: "オフサイド",
  corner: "コーナーキック", free_kick: "フリーキック", penalty: "PK", card: "カード",
  substitution: "選手交代", pass: "パス", dribble: "ドリブル", tackle: "タックル", other: "その他",
};
const GENRE = { rpg: "RPG", fps: "FPS" };
const LEAD = 0.3;          // 場面の少し手前から出す(秒)
const SUGOI_LEAD = 3;      // すごい場面は、この秒数前から先出しする
const GLOW_HOLD = 6;       // すごい場面のあと、光らせ続ける秒数
const LOW_CONF = 0.6;

const $ = (id) => document.getElementById(id);
const fmt = (s) => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids) if (k != null) n.append(k);
  return n;
};

const S = {
  events: [], preview: null, meta: null, duration: 0,
  genre: "rpg",              // rpg | fps | none
  audio: false, spoken: new Set(),
  mode: "timer",             // "yt" か "timer"
  t: 0, playing: false, lastKey: "",
  showAll: false,
  player: null, apiState: "loading",   // loading | ready | failed
};

/* ---------- YouTube API ---------- */
function loadYouTubeApi() {
  if (window.YT && window.YT.Player) { S.apiState = "ready"; return; }
  window.onYouTubeIframeAPIReady = () => { S.apiState = "ready"; if (S.pendingOpen) S.pendingOpen(); };
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  s.onerror = () => { S.apiState = "failed"; if (S.pendingOpen) S.pendingOpen(); };
  document.head.append(s);
  setTimeout(() => { if (S.apiState === "loading") { S.apiState = "failed"; if (S.pendingOpen) S.pendingOpen(); } }, 8000);
}

const ERR = {
  100: "動画が見つからないか、非公開です。",
  101: "この動画は、投稿者が埋め込み再生を許可していません。",
  150: "この動画は、投稿者が埋め込み再生を許可していません。",
  153: "プレーヤーの設定エラーです。http://localhost で開いているか確認してください。",
};

function showNotice(msg, videoId) {
  const n = $("notice");
  n.replaceChildren(msg);
  if (videoId) {
    n.append(" ", el("a", { href: "https://www.youtube.com/watch?v=" + encodeURIComponent(videoId), target: "_blank", rel: "noopener" }, "YouTubeで開く"));
  }
  n.hidden = false;
}

/* ---------- 動画を開く ---------- */
async function openVideo(id) {
  const res = await fetch("/api/videos/" + encodeURIComponent(id));
  if (!res.ok) { showNotice("結果を読み込めませんでした。"); return; }
  const j = await res.json();
  S.meta = j.meta || {};
  S.preview = j.data.preview || null;
  S.events = [...j.data.events].sort((a, b) => a.seconds - b.seconds);
  S.duration = Math.max(S.meta.duration || 0, (S.events.at(-1)?.seconds ?? 0) + 8);
  S.t = 0; S.playing = false; S.lastKey = ""; S.spoken.clear(); stopSpeech();
  $("notice").hidden = true;
  $("q").value = ""; renderHits("");

  const videoId = S.meta.videoId;
  const start = () => {
    if (!videoId) return enterTimer("サンプルです。動画はなく、下のバーで時間を動かして試せます。");
    if (S.apiState === "failed") return enterTimer("YouTubeに接続できませんでした。時間を動かして画面だけ試せます。", videoId);
    if (S.apiState === "loading") { S.pendingOpen = start; return; }
    S.pendingOpen = null;
    enterYouTube(videoId);
  };
  start();
  render();
}

function stagePlaceholder(title, sub) {
  $("stage").replaceChildren(el("div", { class: "placeholder" }, el("strong", {}, title), el("span", {}, sub)));
}

function destroyPlayer() {
  if (S.player && S.player.destroy) { try { S.player.destroy(); } catch (_) {} }
  S.player = null;
}

function enterTimer(why, videoId) {
  destroyPlayer();
  S.mode = "timer";
  stagePlaceholder("動画なしの確認モード", "解説の出方を、時間を動かして確かめられます");
  $("scrub").hidden = false;
  $("seek").max = S.duration;
  $("seek").value = 0;
  $("play").textContent = "再生";
  if (why) showNotice(why, videoId);
}

function enterYouTube(videoId) {
  destroyPlayer();
  S.mode = "yt";
  $("scrub").hidden = true;
  $("stage").replaceChildren(el("div", { id: "player" }));
  S.player = new YT.Player("player", {
    videoId,
    playerVars: { rel: 0, playsinline: 1, origin: location.origin },
    events: {
      onError: (e) => {
        const msg = ERR[e.data] || "動画を再生できませんでした(コード " + e.data + ")。";
        enterTimer(msg + " 画面の動きは、時間を動かして確かめられます。", videoId);
        render();
      },
    },
  });
}

/* ---------- 時刻の進み ---------- */
setInterval(() => {
  if (S.mode === "yt" && S.player && typeof S.player.getCurrentTime === "function") {
    const t = S.player.getCurrentTime();
    if (typeof t === "number" && !Number.isNaN(t)) S.t = t;
  } else if (S.mode === "timer" && S.playing) {
    S.t = Math.min(S.duration, S.t + 0.2);
    if (S.t >= S.duration) { S.playing = false; $("play").textContent = "再生"; }
    $("seek").value = S.t;
  }
  if (S.mode === "timer") $("clock").textContent = fmt(S.t) + " / " + fmt(S.duration);
  if (view().key !== S.lastKey) render();
}, 200);

/* いまの状態をひとまとめにする。表示は全部これを見る */
function view() {
  const t = S.t;
  const idx = S.events.filter((e) => e.seconds <= t + LEAD).length;
  const cur = idx ? S.events[idx - 1] : null;
  // すごい場面が近づいたら、先に出す(読んでから見られるように)
  const next = S.events.find((e) => e.sugoi && e.seconds > t + LEAD && e.seconds - t <= SUGOI_LEAD) || null;
  const justNow = !!(cur && cur.sugoi && t - cur.seconds <= GLOW_HOLD);
  const glow = next ? 1 : justNow ? 2 : 0;
  const focus = next || cur;
  return { idx, cur, next, glow, focus, key: `${idx}|${next ? next.seconds : ""}|${glow}` };
}

function seekTo(sec) {
  S.t = sec; S.spoken.clear(); stopSpeech();
  if (S.mode === "yt" && S.player && S.player.seekTo) { S.player.seekTo(sec, true); if (S.player.playVideo) S.player.playVideo(); }
  else { $("seek").value = sec; }
  render();
}

/* ---------- 音声ガイド ---------- */
function stopSpeech() { try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (_) {} }
function speak(text) {
  if (!S.audio || !("speechSynthesis" in window) || !text) return;
  try {
    stopSpeech();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP"; u.rate = 1.05;
    window.speechSynthesis.speak(u);
  } catch (_) {}
}

/* ---------- 描画 ---------- */
function termChips(terms) {
  if (!terms || !terms.length) return null;
  const ul = el("ul", { class: "terms" });
  const box = el("p", { class: "meaning", hidden: true });
  let open = null;
  for (const t of terms) {
    const b = el("button", { type: "button", class: "term", "aria-expanded": "false" }, t.term);
    b.addEventListener("click", () => {
      const was = open === b;
      ul.querySelectorAll(".term").forEach((x) => x.setAttribute("aria-expanded", "false"));
      if (was) { box.hidden = true; open = null; return; }
      b.setAttribute("aria-expanded", "true");
      box.textContent = t.term + ": " + t.meaning;
      box.hidden = false; open = b;
    });
    ul.append(el("li", {}, b));
  }
  const frag = document.createDocumentFragment();
  frag.append(ul, box);
  return frag;
}

function renderStrip(v) {
  const strip = $("strip");
  strip.replaceChildren();
  const e = v.focus;
  if (!e) {
    strip.append(el("p", { class: "gist idle" }, "再生すると、ここに一言が出ます。"));
  } else {
    strip.append(
      el("span", { class: "when" }, fmt(e.seconds)),
      el("span", { class: "kind" }, KIND[e.event] || e.event),
      el("p", { class: "gist" }, e.gist || e.explain),
      v.next ? el("span", { class: "soon" }, "まもなく、すごい") : (e.sugoi ? el("span", { class: "wow" }, "ここ、すごい") : null),
    );
  }
  const fs = el("button", { type: "button", class: "fs", onclick: toggleFullscreen }, "全画面");
  if (!document.fullscreenEnabled) fs.hidden = true;
  strip.append(fs);
}

function toggleFullscreen() {
  const th = $("theater");
  if (document.fullscreenElement) document.exitFullscreen();
  else if (th.requestFullscreen) th.requestFullscreen();
}

function renderDetail(v) {
  const box = $("detail");
  box.replaceChildren();
  box.classList.remove("swap"); void box.offsetWidth; box.classList.add("swap");

  const e = v.focus;
  if (!e) {
    const p = S.preview;
    box.append(el("h2", {}, "見る前に"));
    if (p && p.watchPoints && p.watchPoints.length) {
      box.append(el("p", { class: "sub" }, "注目するところ"), el("ul", { class: "pts" }, ...p.watchPoints.map((w) => el("li", {}, w))));
    }
    if (p && p.basics && p.basics.length) {
      box.append(el("p", { class: "sub" }, "知っておくと分かりやすいルール"), el("ul", { class: "pts" }, ...p.basics.map((w) => el("li", {}, w))));
    }
    if (!p) box.append(el("p", { class: "none" }, "再生すると、ここに解説が出ます。"));
    return;
  }
  const head = el("div", { class: "head" }, el("span", { class: "kind" }, KIND[e.event] || e.event), el("span", { class: "clock" }, fmt(e.seconds)));
  if (v.next) head.append(el("span", { class: "soon" }, "まもなく"));
  else if (e.sugoi) head.append(el("span", { class: "wow" }, "ここ、すごい"));
  if (e.confidence < LOW_CONF) head.append(el("span", { class: "doubt" }, "自信低め"));
  box.append(head, el("p", { class: "explain" }, e.explain));
  if (e.context) box.append(el("p", { class: "context" }, el("b", {}, "ルール"), e.context));
  if (e.sugoi) {
    const why = e.expertWhy || e.why;
    if (why) box.append(el("div", { class: "block" }, el("p", { class: "lab" }, "経験者がすごいと思う理由"), el("p", {}, why)));
    if (S.genre !== "none") {
      const a = (e.analogies || []).find((x) => x.genre === S.genre);
      const label = GENRE[S.genre] + "でいうと";
      box.append(a
        ? el("div", { class: "block" }, el("p", { class: "lab" }, label), el("p", {}, a.text), el("p", { class: "differs" }, "ちがうところ: " + a.differs))
        : el("div", { class: "block" }, el("p", { class: "lab" }, label), el("p", { class: "differs" }, "この場面は、うまく置き換えられませんでした。")));
    }
  }
  if (e.scene) box.append(el("p", { class: "scene" }, "映像: " + e.scene));
  const chips = termChips(e.terms);
  if (chips) box.append(chips);
}

function renderLog(idx) {
  const list = $("items");
  list.replaceChildren();
  const shown = [];
  S.events.forEach((e, i) => { if (i < idx - 1 || (S.showAll && i >= idx)) shown.push([e, i]); });
  shown.sort((a, b) => b[0].seconds - a[0].seconds);
  if (!shown.length) { list.append(el("li", { class: "none" }, idx === 0 ? "まだ場面はありません。" : "これより前の場面はありません。")); return; }
  for (const [e, i] of shown) {
    const why = e.expertWhy || e.why;
    list.append(el("li", { class: "item" + (i >= idx ? " future" : "") },
      el("button", { type: "button", class: "t", title: "この場面へ", onclick: () => seekTo(e.seconds) }, fmt(e.seconds)),
      el("div", {},
        el("p", { class: "e" }, e.gist || e.explain, e.sugoi ? el("span", { class: "wow" }, "すごい") : null),
        why ? el("p", { class: "w" }, why) : null)));
  }
}

function render() {
  const v = view();
  S.lastKey = v.key;
  const th = $("theater");
  th.classList.toggle("glow1", v.glow === 1);
  th.classList.toggle("glow2", v.glow === 2);
  renderStrip(v);
  renderDetail(v);
  renderLog(v.idx);
  // 音声ガイド: すごい場面を、先出しの時点で1回だけ読む
  const e = v.focus;
  if (e && e.sugoi && !S.spoken.has(e.seconds)) {
    S.spoken.add(e.seconds);
    speak([e.gist, e.expertWhy].filter(Boolean).join("。"));
  }
}

/* ---------- 場面を探す ---------- */
const norm = (s) => String(s || "").normalize("NFKC").toLowerCase().replace(/\s+/g, "");
const grams = (s) => {
  const out = new Set();
  const t = norm(s);
  if (t.length === 1) out.add(t);
  for (let i = 0; i < t.length - 1; i++) out.add(t.slice(i, i + 2));
  return out;
};
function search(q) {
  const qg = grams(q);
  if (!qg.size) return [];
  const res = [];
  for (const e of S.events) {
    const doc = [e.scene, e.gist, e.explain, e.context, e.expertWhy, e.why, KIND[e.event],
      ...(e.analogies || []).map((a) => a.text), ...(e.terms || []).map((t) => t.term)].join("");
    const dg = grams(doc);
    let hit = 0;
    qg.forEach((g) => { if (dg.has(g)) hit++; });
    if (hit) res.push({ e, score: hit / qg.size });
  }
  return res.sort((a, b) => b.score - a.score).slice(0, 5).filter((r) => r.score >= 0.25);
}
function renderHits(q) {
  const ul = $("hits"), msg = $("qmsg");
  ul.replaceChildren();
  if (!q.trim()) { msg.hidden = true; return; }
  const r = search(q);
  if (!r.length) { msg.textContent = "近い場面が見つかりません。別の言葉で試してください。"; msg.hidden = false; return; }
  msg.hidden = true;
  for (const { e } of r) {
    ul.append(el("li", {}, el("button", { type: "button", class: "hit", onclick: () => seekTo(e.seconds) },
      el("span", { class: "t" }, fmt(e.seconds)),
      el("span", { class: "s" }, e.gist || e.explain, el("small", {}, e.scene)))));
  }
}

/* ---------- 起動 ---------- */
async function init() {
  loadYouTubeApi();
  try { const g = localStorage.getItem("genre"); if (g === "none" || GENRE[g]) S.genre = g; } catch (_) {}
  const gbox = $("genres");
  const paintGenres = () => gbox.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.g === S.genre)));
  for (const [g, label] of [...Object.entries(GENRE), ["none", "たとえなし"]]) {
    gbox.append(el("button", { type: "button", "data-g": g, onclick: () => {
      S.genre = g; paintGenres(); render();
      try { localStorage.setItem("genre", g); } catch (_) {}
    } }, label));
  }
  paintGenres();

  if ("speechSynthesis" in window) {
    const a = $("audio");
    a.hidden = false;
    a.addEventListener("click", () => {
      S.audio = !S.audio;
      a.setAttribute("aria-pressed", String(S.audio));
      a.textContent = S.audio ? "音声ガイド: オン" : "音声ガイド";
      if (!S.audio) stopSpeech(); else { S.spoken.clear(); render(); }
    });
  }

  $("play").addEventListener("click", () => {
    if (S.t >= S.duration) { S.t = 0; $("seek").value = 0; S.spoken.clear(); }
    S.playing = !S.playing;
    $("play").textContent = S.playing ? "停止" : "再生";
  });
  $("seek").addEventListener("input", (ev) => { S.t = Number(ev.target.value); S.spoken.clear(); stopSpeech(); render(); });
  $("q").addEventListener("input", (ev) => renderHits(ev.target.value));
  $("showAll").addEventListener("change", (ev) => { S.showAll = ev.target.checked; render(); });
  document.addEventListener("fullscreenchange", render);

  const res = await fetch("/api/videos");
  const vids = res.ok ? await res.json() : [];
  const picker = $("picker");
  if (!vids.length) {
    picker.hidden = true;
    $("detail").replaceChildren(el("h2", {}, "表示できる結果がありません"), el("p", {}, "python analyze.py で動画を解析すると、ここに表示されます。"));
    return;
  }
  for (const v of vids) {
    picker.append(el("option", { value: v.id }, (v.sample ? "サンプル（動画なし）" : v.id) + "  " + v.count + "場面"));
  }
  picker.addEventListener("change", () => openVideo(picker.value));
  openVideo(vids[0].id);
}
init();
</script>
